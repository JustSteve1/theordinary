# Chosen only with `kedro run --env=prod`. Queries omit the WHOOP payload column.

whoop_cycle:
  type: pandas.GBQQueryDataset
  project: the-ordinary-512212
  load_args:
    location: europe-west2
  sql: |
    select member_key, record_id, record_updated_at, start_at, end_at,
           timezone_offset, score_state, deleted, source, ingested_at
    from `the-ordinary-512212.ordinary_raw.whoop_cycle`
    order by ingested_at desc
    limit 100

