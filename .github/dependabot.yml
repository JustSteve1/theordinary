version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-js:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
