version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "mvp-next"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-deps:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "mvp-next"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
