name: Warehouse

on:
  pull_request:
  schedule:
    - cron: "40 9 * * *"
    - cron: "40 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Dataform
        run: npx --yes @dataform/cli@3.1.0 compile --project-dir warehouse/dataform

  run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DATAFORM_SA }}
      - name: Write Dataform ADC credentials
        run: |
          printf '%s\n' '{ "projectId": "the-ordinary-512212", "location": "europe-west2" }' > warehouse/dataform/.df-credentials.json
      - name: Build the daily spine
        run: npx --yes @dataform/cli@3.1.0 run --project-dir warehouse/dataform --tags spine --vars=gitSha=${{ github.sha }}
      - name: Prove the estimator, then build effects
        run: |
          npx --yes @dataform/cli@3.1.0 run --project-dir warehouse/dataform --tags studies --vars=gitSha=${{ github.sha }}
          npx --yes @dataform/cli@3.1.0 run --project-dir warehouse/dataform --tags effects_test --vars=gitSha=${{ github.sha }}
          npx --yes @dataform/cli@3.1.0 run --project-dir warehouse/dataform --tags effects --vars=gitSha=${{ github.sha }}
      # The Chronos-2 job is a Cloud Run job in europe-west2 (warehouse/forecast/setup.sh).
      # FORECAST_JOB_ENABLED=true is set as a repository variable once that job exists,
      # so nightly runs stay green while it does not.
      - uses: google-github-actions/setup-gcloud@v2
        if: vars.FORECAST_JOB_ENABLED == 'true'
      - name: Draw the Chronos-2 baseline
        if: vars.FORECAST_JOB_ENABLED == 'true'
        run: |
          gcloud run jobs execute ordinary-forecast --project the-ordinary-512212 --region europe-west2 --wait
          npx --yes @dataform/cli@3.1.0 run --project-dir warehouse/dataform --tags forecast --vars=gitSha=${{ github.sha }}
      # Copies each member's newest forecast run into Neon so Home draws the band
      # without reading BigQuery. Needs APP_URL (variable) and CRON_SECRET (secret).
      - name: Snapshot the baseline for Home
        if: vars.FORECAST_JOB_ENABLED == 'true' && vars.APP_URL != ''
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/baseline-snapshot"
